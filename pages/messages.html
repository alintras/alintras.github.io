<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/css/base/site-tokens.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/style.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <link rel="stylesheet" href="/css/pages/messages.css">
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()"></button>

  <h1>Messages</h1>
  <div id="err-box"></div>

  <div id="compose">
    <div id="user-id-row">Your ID: <span id="user-id-display">—</span></div>
    <label for="msg-text">Message</label>
    <textarea id="msg-text" placeholder="Write something…" maxlength="500"></textarea>
    <div id="image-row">
      <label id="image-label" for="file-input">+ image</label>
      <input type="file" id="file-input" accept="image/*" />
      <img id="image-preview" alt="preview" />
      <button id="clear-img">remove</button>
    </div>
    <div id="submit-row"><button id="submit-btn">Post</button></div>
    <div id="status"></div>
  </div>

  <div id="feed-header">
    <h2>All messages</h2>
    <span id="msg-count"></span>
  </div>
  <div id="loading">Loading…</div>
  <div id="feed"></div>
  <div id="empty" style="display:none">No messages yet. Be the first!</div>

<script src="/js/pages/messages.js"></script>
</body>
</html>
