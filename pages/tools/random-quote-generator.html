<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/base/site-tokens.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/style.js"></script>
    <link rel="stylesheet" href="/css/components/tool-generators.css">
    <link rel="stylesheet" href="/css/pages/tools/random-quote-generator.css">
</head>
<body>
    <div class="container">
        <header class="quote-page-header">
            <h1>Quote Generator</h1>
            <p>Get your quote of the day</p>
        </header>

        <div class="category-filter" id="categoryFilter">
            <button class="active" data-category="all">All</button>
            <button data-category="inspirational">Inspirational</button>
            <button data-category="motivational">Motivational</button>
            <button data-category="life">Life</button>
            <button data-category="success">Success</button>
            <button data-category="wisdom">Wisdom</button>
        </div>

        <div class="panel">
            <div class="quote-display">
                <div id="quoteText">Loading inspiration...</div>
                <div id="quoteAuthor"></div>
                <div><span class="category-badge" id="categoryBadge"></span></div>
            </div>
            
            <div class="controls">
                <button id="newQuoteBtn">New Quote</button>
                <button id="copyBtn">Copy</button>
                <button id="tweetBtn">Tweet</button>
            </div>
        </div>
    </div>

    <script src="/js/pages/tools/random-quote-generator.js"></script>
</body>
</html>
