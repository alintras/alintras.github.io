<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/css/base/site-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shiny Counter</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/style.js"></script>
<link rel="stylesheet" href="/css/pages/tools/counter.css">
</head>
<body>

<header>
  <h1>★shiny counter★</h1>
  <button id="reminder-btn" title="toggle backup reminder"></button>
  <button id="import-btn" title="import backup">↑</button>
  <button id="export-btn" title="export backup">↓</button>
  <button id="keybind-btn" title="set hotkey"></button>
</header>
<input type="file" id="import-file" class="import-file-input" accept=".json">

<div id="counter-tabs"></div>

<div id="main">
  <div id="empty-state">no counters yet.<br>press [+] to add one.</div>

  <div id="counter-ui" class="counter-ui-layout" style="display:none">
    <div id="top-bar">
      <button id="undo-btn">↩ undo</button>
      <button id="counter-name-display" title="tap to rename"></button>
      <button id="inc-btn" title="tap to change increment">+1/tap</button>
      <button id="reset-btn">reset</button>
    </div>
    <div id="timer-bar">
      <div class="timer-box">
        <span class="timer-label">total hunt time</span>
        <span id="total-time-val" class="timer-val">00:00:00</span>
      </div>
      <button id="timer-toggle-btn" title="pause/resume timer">⏸</button>
      <div class="timer-box">
        <span class="timer-label">since last tap</span>
        <span id="last-tap-val" class="timer-val">00:00:00</span>
      </div>
    </div>
    <div id="count-display" title="tap to edit">0</div>
    <button id="hit-btn">+1 ENCOUNTER</button>
  </div>
</div>

<!-- Modal for name input -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">new counter</h2>
    <input type="text" id="modal-input" maxlength="32" placeholder="e.g. Giratina, Starter...">
    <div id="modal-btns">
      <button id="modal-skip" style="display:none"></button>
      <button id="modal-cancel">cancel</button>
      <button id="modal-confirm" class="primary">confirm</button>
    </div>
  </div>
</div>

<script src="/js/pages/tools/counter.js"></script>
</body>
</html>
