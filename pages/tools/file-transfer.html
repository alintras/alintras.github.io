<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/css/base/site-tokens.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Transfer</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/style.js" defer></script>
  <link rel="stylesheet" href="/css/components/tool-page.css">
  <link rel="stylesheet" href="/css/pages/tools/file-transfer.css">
</head>
<body>

  <h1>[ file transfer ]</h1>
  <div class="subtitle">local network &middot; end-to-end encrypted &middot; all devices</div>

  <div class="mode-row">
    <button id="btn-send-mode">send</button>
    <button id="btn-recv-mode">receive</button>
  </div>

  <!-- SEND -->
  <div id="send-ui">
    <div class="label">your code — share with receiver:</div>
    <div id="code-display">------</div>
    <div class="label">or scan:</div>
    <div id="qr-wrap"></div>
    <div class="status-line" id="send-status">initialising...</div>

    <div id="file-section" style="display:none">
      <div class="section">
        <input type="file" id="file-input" multiple>
        <br><br>
        <button id="btn-send-file">send files</button>
      </div>
      <div class="progress-wrap" id="s-pw" style="display:none"><div class="progress-bar" id="s-pb"></div></div>
      <div class="status-line" id="send-file-status"></div>
    </div>
  </div>

  <!-- RECEIVE -->
  <div id="recv-ui">
    <div class="label">enter sender code:</div>
    <input type="text" id="code-input" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false">
    <br><br>
    <button id="btn-connect">connect</button>
    <div class="status-line" id="recv-status"></div>
    <div class="progress-wrap" id="r-pw" style="display:none"><div class="progress-bar" id="r-pb"></div></div>
    <div id="download-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="/js/pages/tools/file-transfer.js"></script>
</body>
</html>
