<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/css/base/site-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Art Maker</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages/tools/pixelart.css">
<script src="/js/style.js"></script>
</head>
<body>

<div id="topbar">
  <span id="title">[Pixel Art]</span>
  <div class="tool-group">
    <button class="size-btn" data-size="8">8</button>
    <button class="size-btn active" data-size="16">16</button>
    <button class="size-btn" data-size="32">32</button>
    <button class="size-btn" data-size="64">64</button>
  </div>
</div>

<div id="toolbar">
  <div class="tool-group">
    <button class="tool-btn active" data-tool="draw" title="Draw"><img class="tool-icon" src="/assets/smileys/pencil.png" alt="✏"></button>
    <button class="tool-btn" data-tool="fill" title="Fill"><img class="tool-icon" src="/assets/smileys/bucket.png" alt="⬛"></button>
    <button class="tool-btn" data-tool="erase" title="Erase"><img class="tool-icon" src="/assets/smileys/eraser.png" alt="✕"></button>
    <button class="tool-btn" data-tool="eyedrop" title="Pick color"><img class="tool-icon" src="/assets/smileys/eyedrop.png" alt="⊙"></button>
  </div>
  <div class="sep"></div>
  <div class="tool-group">
    <button id="undo-btn" disabled title="Undo (Ctrl+Z)">↩</button>
    <button id="redo-btn" disabled title="Redo (Ctrl+Y)">↪</button>
  </div>
  <div class="sep"></div>
  <div class="tool-group">
    <button id="clear-btn">Clear</button>
    <button id="save-btn">Save PNG</button>
  </div>
  <div class="sep"></div>
  <div class="tool-group tool-group-options">
    <label class="tool-option">
      <input type="checkbox" id="transparent-empty" checked> Transp.
    </label>
    <label class="tool-option-nowrap">
      bg: <input type="color" id="bg-color" value="#ffffff" class="background-color-input">
    </label>
  </div>
  <div class="sep"></div>
  <div class="tool-group tool-group-trace">
    <button id="trace-load-btn">Trace</button>
    <input type="file" id="trace-input" class="trace-file-input" accept="image/*">
    <input type="range" id="trace-opacity" min="10" max="90" value="40" title="Trace opacity">
    <button id="trace-clear-btn" style="display:none;font-size:0.8em;">✕</button>
  </div>
</div>

<div id="palette-row">
  <div id="palette"></div>
  <input type="color" id="custom-color" value="#000000" title="Custom color">
  <div id="active-swatch"></div>
</div>

<div id="canvas-area">
  <div id="viewport">
    <canvas id="canvas"></canvas>
  </div>
  <div id="zoom-controls">
    <button id="zoom-in-btn" title="Zoom in">+</button>
    <button id="zoom-out-btn" title="Zoom out">−</button>
    <button id="zoom-reset-btn" title="Reset zoom">⊡</button>
  </div>
  <div id="zoom-indicator">100%</div>
</div>

<div id="bottombar">
  <span id="undo-count"></span>
  <span id="pos-info"></span>
</div>

<script src="/js/pages/tools/pixelart.js"></script>
</body>
</html>
