<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/css/base/site-tokens.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen 3 IV Calculator</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/style.js" defer></script>
  <link rel="stylesheet" href="/css/components/tool-page.css">
  <link rel="stylesheet" href="/css/pages/tools/iv-calc.css">
</head>
<body>

  <div id="wrap">
    <header class="simple-header">
    <h1>Gen 3 IV Calculator</h1>
    <p class="desc">
      Enter a Pokémon's stats to find its possible IVs.
      <a class="tool-link" href="pokefinder.html">Find any Pokémon →</a>
    </p>
    </header>
<!--
    <div class="note">
      HP formula: <code>⌊(2B + IV + ⌊EV/4⌋) × L / 100⌋ + L + 10</code><br>
      Other stats: <code>⌊(⌊(2B + IV + ⌊EV/4⌋) × L / 100⌋ + 5) × N⌋</code> where N = 1.1 / 0.9 / 1.0
    </div>
-->
    <div class="section-label">Pokémon</div>
    <div class="grid">
      <div class="field field-wide">
        <label>Species</label>
        <select id="species" onchange="onSpecies()"></select>
      </div>
      <div class="field">
        <label>Level</label>
        <input id="level" type="number" min="1" max="100" value="50">
      </div>
      <div class="field">
        <label>Nature</label>
        <select id="nature" onchange="updateNatureHighlight()">
          <option value="0">Hardy</option><option value="1">Lonely</option><option value="2">Brave</option>
          <option value="3">Adamant</option><option value="4">Naughty</option><option value="5">Bold</option>
          <option value="6">Docile</option><option value="7">Relaxed</option><option value="8">Impish</option>
          <option value="9">Lax</option><option value="10">Timid</option><option value="11">Hasty</option>
          <option value="12">Serious</option><option value="13">Jolly</option><option value="14">Naive</option>
          <option value="15">Modest</option><option value="16">Mild</option><option value="17">Quiet</option>
          <option value="18">Bashful</option><option value="19">Rash</option><option value="20">Calm</option>
          <option value="21">Gentle</option><option value="22">Sassy</option><option value="23">Careful</option>
          <option value="24">Quirky</option>
        </select>
      </div>
    </div>

    <div class="section-label">Stats &amp; EVs</div>
    <table id="stat-table">
      <thead>
        <tr><th>Stat</th><th>Base</th><th>EV (0–252)</th><th>Actual stat</th><th>IV range</th></tr>
      </thead>
      <tbody id="stat-tbody"></tbody>
    </table>

    <button id="calc-btn" onclick="calculate()">Calculate IVs</button>
  </div>

  <script src="/js/pages/tools/iv-calc.js"></script>
</body>
</html>
