<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/css/base/site-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver's License Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/style.js"></script>
<link rel="stylesheet" href="/css/components/document-generator.css">
<link rel="stylesheet" href="/css/components/document-generator-buttons.css">
<link rel="stylesheet" href="/css/pages/fun/fuehrerschein.css">
</head>
<body>
<h1 data-t="fs_title">Driver's License Generator</h1>
<div class="wrap">
  <div>
    <label data-t="country">Country</label>
    <select id="country" onchange="u()">
      <optgroup label="Europe"><option value="DE">Germany</option><option value="AT">Austria</option><option value="CH">Switzerland</option><option value="FR">France</option><option value="IT">Italy</option><option value="ES">Spain</option><option value="NL">Netherlands</option><option value="PL">Poland</option><option value="SE">Sweden</option><option value="GB">United Kingdom</option><option value="NO">Norway</option><option value="PT">Portugal</option><option value="GR">Greece</option><option value="RU">Russia</option></optgroup>
      <optgroup label="Americas / Oceania"><option value="US">USA</option><option value="CA">Canada</option><option value="MX">Mexico</option><option value="BR">Brazil</option><option value="AU">Australia</option></optgroup>
      <optgroup label="Asia"><option value="CN">China</option><option value="IN">India</option><option value="JP">Japan</option><option value="KR">South Korea</option><option value="TR">Turkey</option><option value="AE">UAE</option><option value="SG">Singapore</option></optgroup>
    </select>
    <label data-t="first_name">First name</label><input type="text" id="fn" value="Max" oninput="u()">
    <label data-t="last_name">Last name</label><input type="text" id="ln" value="Mustermann" oninput="u()">
    <label data-t="date_of_birth">Date of birth</label><input type="date" id="dob" value="1990-01-15" oninput="u()">
    <label data-t="place_of_birth">Place of birth</label><input type="text" id="pob" value="Berlin" oninput="u()">
    <label data-t="issued">Issued</label><input type="date" id="iss" value="2010-06-01" oninput="u()">
    <label data-t="valid_until">Valid until</label><input type="date" id="exp" value="2035-06-01" oninput="u()">
    <label data-t="authority">Authority</label><input type="text" id="auth" value="Road Traffic Office Berlin" oninput="u()">
    <label data-t="classes">Classes</label>
    <div class="cats" id="cats">
      <span class="cat" onclick="tc(this)">AM</span><span class="cat on" onclick="tc(this)">B</span><span class="cat" onclick="tc(this)">BE</span><span class="cat" onclick="tc(this)">C</span><span class="cat" onclick="tc(this)">CE</span><span class="cat on" onclick="tc(this)">A</span><span class="cat" onclick="tc(this)">A1</span><span class="cat" onclick="tc(this)">T</span>
    </div>
    <label data-t="photo">Photo</label>
    <div class="photo-drop" id="pd"><span data-t="upload_photo">Upload photo</span><input type="file" accept="image/*" onchange="lp(this)"></div>
    <div class="presets"><span data-t="examples">Examples:</span>
      <a onclick="sp('Max','Mustermann','1990-01-15','Berlin')">Max M.</a>
      <a onclick="sp('Anna','Schmidt','1985-06-20','Munich')">Anna S.</a>
    </div>
    <button onclick="u()" data-t="create">Create</button>
  </div>
  <div>
    <div class="card" id="card">
      <div class="card-bg" id="c-bg"></div>
      <div class="card-accent" id="c-accent"></div>
      <div class="card-inner">
        <div class="c-header">
          <div class="c-title-block">
            <div class="c-country" id="c-country">BUNDESREPUBLIK DEUTSCHLAND</div>
            <div class="c-main" id="c-main">FÜHRERSCHEIN</div>
          </div>
          <div class="c-flag" id="c-flag">🇩🇪</div>
        </div>
        <div class="c-body">
          <div class="c-photo" id="c-photo"><span>PHOTO</span></div>
          <div class="c-fields" id="c-fields">
            <div><div class="l">1. Last name</div><div class="v" id="c-ln">MUSTERMANN</div></div>
            <div><div class="l">2. First name</div><div class="v" id="c-fn">MAX</div></div>
            <div><div class="l">3. Date of birth</div><div class="v" id="c-dob">15.01.1990</div></div>
            <div><div class="l">4b. Place of birth</div><div class="v" id="c-pob">BERLIN</div></div>
            <div><div class="l">4a. Issued</div><div class="v" id="c-iss">01.06.2010</div></div>
            <div><div class="l">4b. Expiry</div><div class="v" id="c-exp">01.06.2035</div></div>
          </div>
        </div>
        <div class="c-sig" id="c-sig">Max Mustermann</div>
        <div class="c-cats" id="c-cats"><div class="c-catbox">B</div><div class="c-catbox">A</div></div>
      </div>
    </div>
    <a class="dl" onclick="alert(t('save_hint'))" data-t="save">↓ Save</a>
  </div>
</div>
<script src="/js/pages/fun/fuehrerschein.js"></script>
</body>
</html>
