<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/css/base/site-tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Card Generator</title>
<link rel="stylesheet" href="/css/style.css">
<script src="lang.js"></script>
<script src="/js/style.js"></script>
<link rel="stylesheet" href="/css/pages/fun/zeugnis.css">
</head>
<body>
<h1 data-t="z_title">Report Card Generator</h1>
<div class="wrap">
  <div>
    <label data-t="style">Style</label>
    <div class="style-row">
      <button class="sb on" onclick="setStyle(this,'')" data-t="z_classic">Classic</button>
      <button class="sb" onclick="setStyle(this,'z-dark')" data-t="z_dark">Dark</button>
    </div>
    <label data-t="z_student">Student name</label><input type="text" id="name" value="Max Mustermann" oninput="u()">
    <label data-t="z_class">Class</label><input type="text" id="grade" value="8b" oninput="u()">
    <label data-t="z_year">School year</label><input type="text" id="year" value="2023/2024" oninput="u()">
    <label data-t="z_school">School name</label><input type="text" id="school" value="International School Berlin" oninput="u()">
    <label data-t="z_type">Type</label>
    <select id="sem" onchange="u()">
      <option value="J" data-t="z_annual">Annual report</option>
      <option value="H" data-t="z_semester">1st semester</option>
    </select>
    <label data-t="z_promoted">Promoted to</label><input type="text" id="next" value="9b" oninput="u()">
    <label data-t="z_notes">Notes</label><textarea id="note" rows="2" oninput="u()">Max has shown great effort and made excellent progress this year.</textarea>
    <label data-t="z_teacher">Class teacher</label><input type="text" id="sig1" value="Dr. H. Miller" oninput="u()">
    <label data-t="z_principal">Principal</label><input type="text" id="sig2" value="A. Johnson" oninput="u()">
    <hr class="subject-divider">
    <div class="subject-heading" data-t="z_subjects">Subjects</div>
    <div id="slist"></div>
    <a class="add-link" onclick="addS()" data-t="z_add_subject">+ Add subject</a>
    <br><button class="sec" onclick="u()" data-t="z_update">Update</button>
  </div>
  <div>
    <div class="zeugnis" id="z">
      <div class="z-inner"></div>
      <div class="z-corner tl">✦</div><div class="z-corner tr">✦</div>
      <div class="z-corner bl">✦</div><div class="z-corner br">✦</div>
      <div class="z-school" id="z-school">International School Berlin</div>
      <div class="z-title" id="z-title-word">REPORT CARD</div>
      <div class="z-sub" id="z-sub">Annual Report · 2023/2024</div>
      <div class="z-info"><span data-t="z_verliehen_an">Student</span>: <strong id="z-name">Max Mustermann</strong> &nbsp;|&nbsp; <span data-t="z_klasse">Class</span>: <strong id="z-grade">8b</strong></div>
      <hr class="z-hr">
      <table><thead><tr><th data-t="z_fach">Subject</th><th class="grade-heading" data-t="z_note_col">Grade</th></tr></thead><tbody id="z-tbody"></tbody></table>
      <hr class="z-hr">
      <div class="z-info"><span data-t="z_versetzt">Promoted to class</span>: <strong id="z-next">9b</strong></div>
      <div class="z-note" id="z-note">Max has shown great effort and made excellent progress this year.</div>
      <div class="z-sigs">
        <div class="z-sig" id="z-sig1">Dr. H. Miller</div>
        <div class="z-stamp" id="z-stamp">ISB</div>
        <div class="z-sig" id="z-sig2">A. Johnson</div>
      </div>
    </div>
    <a class="dl" onclick="alert(t('save_hint'))" data-t="save">↓ Save</a>
  </div>
</div>
<script>
const def=[['English','A'],['Mathematics','B'],['Science','A'],['History','A+'],['Biology','B+'],['Physics','B'],['PE','A'],['Art','A'],['Music','A+']];
let subs=def.map(([n,g])=>({n,g}));
function renderList(){
  document.getElementById('slist').innerHTML=subs.map((s,i)=>`
    <div class="subject-row">
      <input type="text" value="${s.n}" oninput="subs[${i}].n=this.value;u()">
      <select onchange="subs[${i}].g=this.value;u()">
        ${['A+','A','B+','B','C+','C','D','F'].map(g=>`<option${g===s.g?' selected':''}>${g}</option>`).join('')}
      </select>
    </div>`).join('');
}
function addS(){subs.push({n:'New Subject',g:'B'});renderList();u();}
function setStyle(el,cls){document.querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));el.classList.add('on');document.getElementById('z').className='zeugnis'+(cls?' '+cls:'');}
function gClass(g){const m={'A+':'g1','A':'g2','B+':'g2','B':'g3','C+':'g3','C':'g4','D':'g5','F':'g6'};return m[g]||'';}
function u(){
  document.getElementById('z-school').textContent=document.getElementById('school').value;
  document.getElementById('z-name').textContent=document.getElementById('name').value;
  document.getElementById('z-grade').textContent=document.getElementById('grade').value;
  document.getElementById('z-next').textContent=document.getElementById('next').value;
  document.getElementById('z-note').textContent=document.getElementById('note').value;
  document.getElementById('z-sig1').textContent=document.getElementById('sig1').value;
  document.getElementById('z-sig2').textContent=document.getElementById('sig2').value;
  const isAnnual=document.getElementById('sem').value==='J';
  const semLabel=isAnnual?t('z_annual'):t('z_semester');
  document.getElementById('z-sub').textContent=`${semLabel} · ${document.getElementById('year').value}`;
  document.getElementById('z-tbody').innerHTML=subs.map(s=>`<tr><td>${s.n}</td><td class="${gClass(s.g)}">${s.g}</td></tr>`).join('');
  const sch=document.getElementById('school').value.toUpperCase().split(' ');
  document.getElementById('z-stamp').innerHTML=sch.slice(0,3).map(w=>w[0]).join('');
}
document.addEventListener('langready',()=>{renderList();u();});
</script>
</body>
</html>
